name: Tests

on:
  push:
    branches: [main, testing, backend, frontend]
  pull_request:
    branches: [main, testing, backend, frontend]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, pdo_sqlite
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache de dependencias Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias PHP
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Instalar dependencias Node
        run: npm ci

      - name: Compilar assets
        run: npm run build

      - name: Copiar .env
        run: cp .env.example .env

      - name: Generar app key
        run: php artisan key:generate

      - name: Configurar SQLite en memoria
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Correr tests (PHPUnit)
        run: php artisan test
